<div class="users-page">
  <!-- Top Bar -->
  <app-top-bar title="Users">
    <button type="button" class="btn btn-primary btn-sm" (click)="openAddAccount()" [disabled]="isLoading">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add Account
    </button>
    <button type="button" class="btn btn-ghost btn-sm" (click)="loadUsers()" [disabled]="isLoading" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>
  </app-top-bar>

  <div class="page-body">
    <!-- Accounts panel -->
    <div class="panel">
      <app-filter-bar
        title="Account Management"
        [subtitle]="summaryLine"
        searchPlaceholder="Search users..."
        [searchValue]="searchTerm"
        [categories]="roleFilters"
        [selectedCategory]="roleFilter"
        (searchChange)="searchTerm = $event"
        (categoryChange)="roleFilter = $event">
      </app-filter-bar>

      <app-skeleton-table *ngIf="isLoading" [rows]="9" [cols]="5"></app-skeleton-table>

      <app-data-table *ngIf="!isLoading"
          [columns]="tableColumns"
          [data]="filteredUsers"
          [clickable]="false"
          emptyIcon="👤"
          emptyTitle="No accounts found"
          [emptyMessage]="searchTerm || roleFilter ? 'No accounts match your filter' : 'Add your first account to get started'"
          [emptyAction]="searchTerm || roleFilter ? '' : 'Add First Account'"
          (emptyActionClick)="openAddAccount()">

          <!-- User cell: initial avatar + username -->
          <ng-template cellDef="user" let-row>
            <div class="user-cell">
              <span class="user-avatar" [class.inactive]="!row.isActive">{{ row.initial }}</span>
              <span class="user-name" [class.strikethrough]="!row.isActive">{{ row.username }}</span>
              <span *ngIf="row.username.toLowerCase() === (currentUsername || '').toLowerCase()"
                class="you-chip">you</span>
            </div>
          </ng-template>

          <!-- Role cell -->
          <ng-template cellDef="role" let-row>
            <span class="role-badge" [class]="'role-' + row.roleLabel.toLowerCase()">
              {{ row.roleLabel }}
            </span>
          </ng-template>

          <!-- Last login cell -->
          <ng-template cellDef="lastLogin" let-row>
            <span class="login-cell" *ngIf="row.lastLoginAt; else never">
              {{ row.lastLoginAt | date:'MMM d, h:mm a' }}
            </span>
            <ng-template #never><span class="login-never">Never</span></ng-template>
          </ng-template>

          <!-- Status cell -->
          <ng-template cellDef="status" let-row>
            <span class="status-dot" [class.ok]="row.isActive" [class.off]="!row.isActive"></span>
            {{ row.isActive ? 'Active' : 'Inactive' }}
          </ng-template>

          <!-- Actions cell -->
          <ng-template cellDef="actions" let-row>
            <div class="row-actions">
              <button type="button" class="action-btn-mini" title="Reset password" aria-label="Reset password for {{ row.username }}"
                (click)="openPasswordReset(row)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
              </button>
              <button
                type="button"
                class="action-btn-mini"
                *ngIf="canToggle(row)"
                [class.delete]="row.isActive"
                [title]="row.isActive ? 'Deactivate account' : 'Activate account'"
                [attr.aria-label]="(row.isActive ? 'Deactivate ' : 'Activate ') + row.username"
                (click)="toggleActive(row)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                  <path d="M12 2v10"/>
                </svg>
              </button>
            </div>
          </ng-template>
        </app-data-table>
      </div>
  </div>
</div>
